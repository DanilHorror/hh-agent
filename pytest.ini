[pytest]
testpaths = test
# Старые проверки-скрипты запускаются через test_offline_scripts.py,
# test_application.py и test_chats.py — ручные проверки с живым браузером.
addopts = --ignore=test/test_application.py --ignore=test/test_chats.py --ignore=test/test_keywords.py --ignore=test/test_llm_keywords.py --ignore=test/test_llm_gigachat.py
