# Проверка на каждый push и pull request: линтер, тесты, сборка Docker-образа.
# Тесты не ходят в сеть и не требуют моделей: провайдеры LLM, Telegram и браузер в них подменены заглушками.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Линтер и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Зависимости (torch без CUDA — в тестах модели не загружаются)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Линтер — только ошибки (синтаксис, неопределённые имена), не стиль
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Пример резюме и критериев вместо личных файлов
        run: |
          cp resume.example.txt resume.txt
          cp criteria.example.txt criteria.txt

      - name: Тесты
        run: pytest -q

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hh-agent-services:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
